# Mosquitto configuration for the local demo stack (docker-compose.yml).
# Reviewed from the MIT xPRO coursework file; see git history.

# Anonymous access, no TLS: acceptable for a local, single-host demo with
# synthetic data, and the reason this broker must never be exposed beyond
# localhost. A deployment would add a password file or client certificates.
allow_anonymous true
listener 1883

# No persistence: messages and QoS 1 sessions live in memory only. The
# coursework also set persistence_location, which is unused without
# persistence and has been removed.
persistence false

# Log to stdout so that `docker compose logs` shows the broker log. The
# coursework logged to a bind-mounted file, which wrote into the source tree.
log_dest stdout

# The queue Mosquitto keeps for each subscribed client (Phase 3, Task 3.3,
# DETENTE 3.3.h). With the defaults (1000 queued QoS 1 messages, no byte
# limit) a bridge that fell behind for under a second lost messages: past the
# limit Mosquitto drops new messages for that client and still sends the
# publisher its PUBACK. Sizing rule, kept with the values:
#   max_queued_messages = R_max x T_stall
#     R_max   2000 msg/s, the highest rate the benchmark measured as
#             sustainable (F3 candidate)
#     T_stall 30 s of bridge stall absorbed; below 1.5 x the bridge's 60 s
#             keepalive, past which Mosquitto drops the connection and, with
#             a clean session, the whole queue anyway
#     -> 60000 messages
#   max_queued_bytes = 2 x max_queued_messages x 218 B, rounded up to MiB
#     218 B: payload per queued message, measured at the limit
#     ($SYS store bytes / store count, benchmark diagnostic 2026-10-11)
#     -> 25 MiB: a memory guard that binds only if queued messages average
#        more than twice the measured size
# Beyond either limit Mosquitto still drops new messages for that client,
# acknowledging the publisher (no backpressure); the bridge logs each
# increase of the dropped counter (mqtt_messages_dropped, ERROR). Under a
# sustained rate above the bridge's capacity no finite queue prevents the
# loss: it only delays it, and adds latency.
max_queued_messages 60000
max_queued_bytes 26214400

# $SYS update interval, the default made explicit: the bridge's drop monitor
# reads $SYS/broker/publish/messages/dropped, so a drop is logged up to this
# many seconds after it happens.
sys_interval 10
