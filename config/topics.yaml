# Topic names for MQTT and Kafka. Every component reads them from here.
#
# The TELEMETRY_TOPIC environment variable, when set and non-empty,
# overrides kafka.telemetry_raw.name; nothing else is overridable.
#
# A Kafka topic may carry `configs`, topic-level settings applied when
# broker/kafka/provision.py creates it.

mqtt:
  telemetry:
    # One topic per asset; {asset_id} is replaced by the publisher.
    template: plant/{asset_id}/telemetry
    subscription: plant/+/telemetry
    qos: 1

kafka:
  telemetry_raw:
    name: telemetry.raw
    description: Validated telemetry from the MQTT bridge, Avro, keyed by asset_id.
    partitions: 3
    replication_factor: 1
    value_schema: schemas/telemetry_v1.avsc
  telemetry_alarms:
    name: telemetry.alarms
    description: Alarm raise and clear events from the alarm consumer, keyed by alarm_id.
    partitions: 3
    replication_factor: 1
    value_schema: schemas/alarm_v1.avsc
    # Compacted, keyed by alarm_id: the topic keeps at least the latest event
    # of every alarm, which the alarm consumer reads at start-up to rebuild
    # its active alarms. Both events of one alarm share a key, so they stay
    # in order on one partition.
    configs:
      cleanup.policy: compact
  telemetry_dlq:
    name: telemetry.dlq
    description: Messages the bridge or the alarm consumer could not process, intact, with the reason; keyed by asset_id when known.
    partitions: 1
    replication_factor: 1
    value_schema: schemas/dlq_v1.avsc
    # Seven days, deletion by age (owner decision, Task 2.3 STEP 0).
    configs:
      cleanup.policy: delete
      retention.ms: 604800000
