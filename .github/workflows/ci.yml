# Continuous integration for the industrial telemetry streaming pipeline.
#
# Four jobs:
#   checks            lint (ruff, node --check) and the unit tests of both
#                     languages with coverage (lines and branches >= 80 %
#                     enforced per language) (Phase 2 Task 2.6)
#   integration       the integration tests on the core stack (Mosquitto,
#                     ZooKeeper, Kafka, Schema Registry); runs only when checks
#                     pass (Phase 2 Task 2.6)
#   integration-full  the integration tests on the full stack, ThingsBoard
#                     included: the ThingsBoard import, the sink, alarm
#                     mapping. Runs only on a push to main and on a manual
#                     dispatch, never on other branches, so it never blocks a
#                     branch (owner decision, Phase 3 DETENTE 3.2.a)
#   pipeline-containers  the pipeline in containers: builds the images of
#                     docker/, starts the core stack with the bridge and the
#                     alarm consumer as containers (make up-pipeline-core) and
#                     runs the 200-message smoke against them (make
#                     smoke-containers) (owner decisions E1 and D-D, Phase 3
#                     Task 3.3). The integration job also builds the images,
#                     for tests/integration/test_containers.py.
#
# Triggers: a push to any branch (owner decision, Phase 3 DETENTE 3.1.a; until
# then only main and feature/**, so docs/** branches ran no CI) and pull
# requests to main.
#
# Until Phase 3 the full profile did not run in CI at all (about 1 GiB more of
# images and 60 s more start-up per push); its tests were a local gate only.
#
# No retries anywhere: a failure is visible and investigated. On failure the
# integration job uploads the component logs and `docker compose logs`.
# Actions are pinned by full commit SHA, with the release tag in a comment,
# and the runner image by version (ubuntu-24.04, not ubuntu-latest), so an
# operating system change is a reviewed commit, not a silent migration.

name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Lint and unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: make install
      - name: Lint
        run: make lint
      - name: Unit tests
        run: make test

  integration:
    name: Integration tests (core stack)
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: make install
      # Public defaults only; a value the pipeline needs is added to
      # .env.example, never written here.
      - name: Environment file
        run: cp .env.example .env
      # A separate step so the image download time is visible on its own.
      # The core profile only: thingsboard sits in profile "full".
      - name: Pull core images
        run: docker compose pull
      - name: Integration tests
        timeout-minutes: 15
        env:
          PYTEST_ADDOPTS: --basetemp=${{ runner.temp }}/pytest
        run: make test-integration
      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: integration-logs
          path: ${{ runner.temp }}/pytest
          if-no-files-found: warn
          retention-days: 7

  integration-full:
    name: Integration tests (full stack)
    needs: checks
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: make install
      - name: Environment file
        run: cp .env.example .env
      - name: Pull full-profile images
        run: docker compose --profile full pull
      # The runner's ThingsBoard volume is empty, so the first start installs
      # the database with the demo tenant and the system administrator; their
      # passwords are the ThingsBoard CE public defaults, given here as
      # environment variables. make -e lets the environment override the empty
      # values .env.example sets.
      - name: Integration tests (full profile)
        timeout-minutes: 30
        env:
          PYTEST_ADDOPTS: --basetemp=${{ runner.temp }}/pytest
          TB_TENANT_PASSWORD: tenant
          TB_SYSADMIN_PASSWORD: sysadmin
        run: make -e test-integration-full
      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: integration-full-logs
          path: ${{ runner.temp }}/pytest
          if-no-files-found: warn
          retention-days: 7

  pipeline-containers:
    name: Pipeline in containers (smoke)
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      # The host side provisions the topics and runs the smoke checks.
      - name: Install dependencies
        run: make install
      - name: Environment file
        run: cp .env.example .env
      - name: Pull core images
        run: docker compose pull
      # A separate step so the cold build time of the two images is visible.
      - name: Build pipeline images
        run: docker compose --profile pipeline build
      - name: Start the core stack and the pipeline containers
        run: make up-pipeline-core
      - name: Smoke against the containers
        timeout-minutes: 10
        run: make smoke-containers
      - name: Save container logs
        if: always()
        run: mkdir -p smoke-logs-containers && docker compose --profile pipeline logs --no-color --timestamps > smoke-logs-containers/docker-compose.log 2>&1 || true
      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pipeline-containers-logs
          path: smoke-logs-containers
          if-no-files-found: warn
          retention-days: 7
      - name: Stop the stack
        if: always()
        run: make down
